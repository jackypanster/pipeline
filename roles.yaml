# roles.yaml — per-target-repo skill bindings (copy into the target repo's .pipeline/)
# Each command resolves its slot to a skill NAME here. Swap a skill any time — the contract is
# unchanged. Framework-, machine-, and LLM-agnostic: NEVER put model or vendor names in this file.
#
# Model-separation invariant (CONTRACT.md):
#   - planner (Step 1 `plan`): frontier model A
#   - reviewer (Step 2 `plan-review` + Step 4 `review`): independent frontier model B (B != A, B != C)
#   - implementer (Step 3 `impl`): capable/cost-efficient coding CLI C (C != B)

plan:        [grill-me, think]          # Step 1: clarify + architecture + <=10 specs + T1-T10 + verify cmds
plan-review: check                      # Step 2: independent adversarial review of plan.md
impl:        <autonomous-coding-skill>  # Step 3 (REQUIRED): real installed name of your autonomous coding skill
review:      check                      # Step 4: code review + mutation spot-check + human-direct merge
hunt:        hunt                       # Escalation: root-cause a blocked feature (>=3 rejects or plan/env halt)
improve:     think                      # Meta: draft a reviewed PR against the pipeline repo (never self-merges)
